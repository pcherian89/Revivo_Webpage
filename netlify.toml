# Netlify build settings. Netlify detects Next.js and adds its Next.js runtime
# automatically (pages, the /api/contact form handler and images all work).
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Build-time image variants have content-hashed names, so they can be cached for good.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The Revivo Pathway prototype (fictional data) stays out of search results.
[[headers]]
  for = "/pathway-demo.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# The Revivo Pathway prototype lives at /pathway/demo (also rewritten in next.config.ts).
[[redirects]]
  from = "/pathway/demo"
  to = "/pathway-demo.html"
  status = 200
  force = true
